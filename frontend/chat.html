<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/chat.css" />
  </head>

  <body>
    <div class="chat-app">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Chats</div>

        <button onclick="toggleSelectionMode()" class="btn btn-sm btn-outline-light m-2">
          + New Group
        </button>

        <div id="groupCreateControls" style="display:none; padding:0 12px;">
          <input
            type="text"
            id="newGroupName"
            class="form-control form-control-sm mb-2"
            placeholder="Group name"
          />
          <button onclick="confirmCreateGroup()" class="btn btn-sm btn-primary w-100 mb-2">
            Create Group
          </button>
        </div>

        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-header">Groups</div>
        <div class="chat-list" id="groupList"></div>
      </div>
      <div class="chat-main">
        <div class="chat-header">
          <button
            class="menu-btn"
            onclick="
              document.getElementById('sidebar').classList.toggle('open')
            "
          >
            ☰
          </button>

          <div class="avatar" id="headerAvatar">G</div>

          <div class="flex-grow-1">
            <div class="name" id="headerName">Select a chat</div>

            <div class="status">online</div>
          </div>

          <button
            id="addMemberBtn"
            onclick="addMemberPrompt()"
            style="display:none;"
            class="btn btn-sm btn-outline-light"
          >
            + Member
          </button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="composer">
          <input
            type="text"
            id="msgInput"
            class="form-control"
            placeholder="Type a message"
            onkeydown="if (event.key === 'Enter') sendMessage();"
          />

          <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>

    <script src="
https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js
"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="./js/chat.js"></script>
  </body>
</html>
