<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Chat</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Chat CSS -->
  <link
    rel="stylesheet"
    href="./css/chat.css"
  />

</head>


<body>

  <div class="chat-app">


    <!-- ==================================================
         SIDEBAR
    =================================================== -->

    <div
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">
        Chats
      </div>


      <button
        onclick="toggleSelectionMode()"
        class="btn btn-sm btn-outline-light m-2"
      >
        + New Group
      </button>


      <div
        id="groupCreateControls"
        style="display: none; padding: 0 12px"
      >

        <input
          type="text"
          id="newGroupName"
          class="form-control form-control-sm mb-2"
          placeholder="Group name"
        />


        <button
          onclick="confirmCreateGroup()"
          class="btn btn-sm btn-primary w-100 mb-2"
        >
          Create Group
        </button>

      </div>


      <!-- Personal chats -->

      <div
        class="chat-list"
        id="chatList"
      ></div>


      <!-- Groups -->

      <div class="sidebar-header">
        Groups
      </div>


      <div
        class="chat-list"
        id="groupList"
      ></div>

    </div>



    <!-- ==================================================
         MAIN CHAT
    =================================================== -->

    <div class="chat-main">


      <!-- ==================================================
           CHAT HEADER
      =================================================== -->

      <div class="chat-header">

        <button
          class="menu-btn"
          onclick="
            document
              .getElementById('sidebar')
              .classList
              .toggle('open')
          "
        >
          ☰
        </button>


        <div
          class="avatar"
          id="headerAvatar"
        >
          G
        </div>


        <div class="flex-grow-1">

          <div
            class="name"
            id="headerName"
          >
            Select a chat
          </div>


          <div class="status">
            online
          </div>

        </div>


        <!-- Add member -->

        <button
          id="addMemberBtn"
          onclick="addMemberPrompt()"
          style="display: none"
          class="btn btn-sm btn-outline-light"
        >
          + Member
        </button>


        <!-- Leave group -->

        <button
          id="leaveGroupBtn"
          onclick="leaveCurrentGroup()"
          style="display: none"
          class="btn btn-sm btn-outline-danger"
        >
          Leave
        </button>

      </div>



      <!-- ==================================================
           MESSAGES
      =================================================== -->

      <div
        class="messages"
        id="messages"
      ></div>



      <!-- ==================================================
           AI SUGGESTIONS
      =================================================== -->

      <div class="ai-suggestions-box">


        <!-- AI Header -->

        <div class="ai-suggestions-header">


          <div class="ai-tabs">

            <button
              type="button"
              id="aiTab"
              class="ai-tab active"
              onclick="showAITab()"
            >
              ✨ AI Suggestions
            </button>


           

          </div>


          <!-- Tone -->

          <select
            id="toneSelect"
            class="tone-select"
          >

            <option value="casual">
              Tone: Casual
            </option>

            <option value="friendly">
              Tone: Friendly
            </option>

            <option value="professional">
              Tone: Professional
            </option>

            <option value="funny">
              Tone: Funny
            </option>

          </select>

        </div>



        <!-- AI SUGGESTIONS PANEL (compose mode) -->

        <div id="aiSuggestionsPanel" class="ai-suggestions-content">


          <!-- AI input -->

          <div class="ai-input-row">


            <input
              type="text"
              id="aiInput"
              placeholder="What do you want to say?"
              autocomplete="off"
            />


            <button
              type="button"
              id="getSuggestionsBtn"
              class="get-ai-btn"
            >
              Get AI Suggestions
            </button>

          </div>



          <!-- AI label -->

          <div class="ai-label">
            ✨ AI Suggestions
          </div>



          <!-- Gemini suggestions appear here (also used for live predictive typing) -->

          <div
            id="suggestionsContainer"
            class="suggestions-container"
          ></div>

        </div>


        
      </div>



      <!-- ==================================================
           MESSAGE COMPOSER
      =================================================== -->

      <div class="composer">


        <!-- File button -->

        <button
          type="button"
          class="send-btn"
          onclick="
            document
              .getElementById('fileInput')
              .click()
          "
        >
          📎
        </button>


        <!-- File input -->

        <input
          type="file"
          id="fileInput"
          style="display: none"
          onchange="uploadFile()"
        />


        <!-- Message input -->

        <input
          type="text"
          id="msgInput"
          class="form-control"
          placeholder="Type a message"
          onkeydown="
            if (event.key === 'Enter') {
              sendMessage();
            }
          "
        />


        <!-- Send -->

        <button
          class="send-btn"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>

    </div>

  </div>



  <!-- ==================================================
       JAVASCRIPT LIBRARIES
  =================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"
  ></script>


  <script
    src="https://cdn.socket.io/4.7.5/socket.io.min.js"
  ></script>


  <!-- Your existing chat JS -->

  <script src="./js/chat.js"></script>

</body>

</html>
